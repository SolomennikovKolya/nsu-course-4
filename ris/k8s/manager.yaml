apiVersion: apps/v1
kind: Deployment
metadata:
  name: manager
  labels: { app: manager }
spec:
  replicas: 1
  selector:
    matchLabels: { app: manager }
  template:
    metadata:
      labels: { app: manager }
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
    spec:
      containers:
        - name: manager
          image: crack-manager:latest
          imagePullPolicy: IfNotPresent   # образ загружен в minikube напрямую
          ports:
            - containerPort: 8000
              name: http
          envFrom:
            - configMapRef:
                name: crack-config
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 20
            periodSeconds: 10
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits:   { cpu: 500m, memory: 512Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: manager
spec:
  type: NodePort
  selector: { app: manager }
  ports:
    - port: 8000
      targetPort: http
      nodePort: 30080
